name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bonk
          POSTGRES_PASSWORD: bonk
          POSTGRES_DB: bonk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bonk -d bonk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go test ./...
        env:
          BONK_TEST_DATABASE_URL: postgres://bonk:bonk@localhost:5432/bonk_test?sslmode=disable
      - run: go vet ./...
